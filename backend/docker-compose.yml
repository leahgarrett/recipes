services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
      POSTGRES_DB: recipes
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - recipes_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
volumes:
  recipes_pgdata:
